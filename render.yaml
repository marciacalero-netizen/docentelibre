services:
  - type: web
    name: game-time-guard
    runtime: node
    plan: free
    rootDir: game-time-guard/backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: game-time-guard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
